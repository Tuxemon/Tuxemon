name: Build Flatpak

on:
  workflow_call:
    inputs:
      IS_RELEASE:
        required: true
        type: boolean

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:kde-6.3
      options: --privileged
    steps:
    - name: Show environment variables
      run: >
        echo IS_RELEASE: ${{ inputs.IS_RELEASE }}

    - name: Checkout repository
      uses: actions/checkout@v6
    # https://stackoverflow.com/questions/60916931/github-action-does-the-if-have-an-else
    - name: Determine flatpak release branch
      uses: haya14busa/action-cond@v1
      id: flatpak_release_branch
      with:
        cond: ${{ inputs.IS_RELEASE }}
        if_true: 'stable'
        if_false: 'development'

    # The manifest tracks the development branch, which is what nightly
    # bundles should ship. A tagged release has to build that tag instead.
    - name: Build releases from the tag instead of development
      if: ${{ inputs.IS_RELEASE }}
      run: |
        sed -i "s|^\( *\)branch: development$|\1tag: ${{ github.ref_name }}|" \
          buildconfig/flatpak/org.tuxemon.Tuxemon.yaml

    - name: Show Flatpak manifest
      run:  |
        ls -R buildconfig/flatpak/
        cat buildconfig/flatpak/org.tuxemon.Tuxemon.yaml
        echo "Game source revision this bundle will contain:"
        git ls-remote https://github.com/Tuxemon/Tuxemon.git \
          "${{ inputs.IS_RELEASE && github.ref_name || 'development' }}"

    - name: Build package
      uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: Tuxemon.flatpak
        manifest-path: buildconfig/flatpak/org.tuxemon.Tuxemon.yaml
        cache: false
        branch: ${{ steps.flatpak_release_branch.outputs.value }}

    - name: Test Flatpak bundle
      run: |
        flatpak install --user --noninteractive Tuxemon.flatpak
        flatpak run org.tuxemon.Tuxemon -h

    - name: Prepare Flatpak directory
      run: |
        mkdir -p Tuxemon-x86_64
        mv Tuxemon.flatpak Tuxemon-x86_64/

    - name: Upload Flatpak artifact as a folder
      uses: actions/upload-artifact@v4
      with:
        name: Tuxemon-x86_64
        path: Tuxemon-x86_64/

