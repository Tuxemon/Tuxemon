events:
  Create Dante:
    actions:
    - create_npc spyder_dante,15,5
    conditions:
    - not char_exists spyder_dante
    - not variable_set hospitalcure:yes
    type: event
  Talk Dante:
    actions:
    - translated_dialog spyder_hospital_dante1
    conditions:
    - is button_pressed INTERACT
    behav:
    - talk spyder_dante
    type: event
  Choice Floor 1st:
    actions:
    - transition_teleport player,spyder_candy_hospital1.tmx,7,15,0.3
    - set_variable choice_floor:null
    conditions:
    - is variable_set choice_floor:1floor
    type: event
  Choice Floor 2nd:
    actions:
    - translated_dialog spyder_hospital_passcode_color
    - translated_dialog_choice red:orange:yellow:green:blue:indigo:violet:black,passcode_color
    - set_variable choice_floor:null
    conditions:
    - is variable_set choice_floor:2floor
    type: event
  Passcode Number:
    actions:
    - translated_dialog spyder_hospital_passcode_number
    - translated_dialog_choice 2!:02:05:10:2F:II:B:..---,passcode_number
    conditions:
    - is variable_set passcode_color
    - not variable_set passcode_number
    type: event
  Passcode Correct:
    actions:
    - transition_teleport player,spyder_candy_hospital2.tmx,11,15,0.3
    - clear_variable passcode_color,passcode_number
    conditions:
    - is variable_set passcode_color:blue
    - is variable_set passcode_number:10
    type: event
  Passcode Rejected Color:
    actions:
    - translated_dialog spyder_hospital_passcode_rejected
    - clear_variable passcode_color,passcode_number
    conditions:
    - is variable_set passcode_number
    - not variable_set passcode_color:blue
    type: event
  Passcode Rejected Number:
    actions:
    - translated_dialog spyder_hospital_passcode_rejected
    - clear_variable passcode_color,passcode_number
    conditions:
    - is variable_set passcode_color:blue
    - is variable_set passcode_number
    - not variable_set passcode_number:10
    type: event
  Create Nurse:
    actions:
    - create_npc spyder_cathedral_nurse,5,4
    - load_yaml spyder_cathedral
    conditions:
    - not char_exists spyder_cathedral_nurse
    type: event
  Set Faint Target:
    actions:
    - set_teleport_faint player,spyder_candy_center.tmx,6,7
    - set_variable faint_set:null
    conditions:
    - is variable_set faint_set:pending
    type: event
  Elevator1:
    actions:
    - translated_dialog_choice 1floor:2floor:no,choice_floor
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    height: 1
    type: event
    width: 2
    x: 13
    y: 4
  Elevator2:
    actions:
    - translated_dialog_choice 1floor:2floor:no,choice_floor
    conditions:
    - is char_facing_tile player
    - is button_pressed INTERACT
    height: 1
    type: event
    width: 2
    x: 17
    y: 4
  Go Outside:
    actions:
    - transition_teleport player,spyder_candy_town.tmx,14,35,0.3
    - char_face player,down
    conditions:
    - is char_at player
    - is char_facing player,down
    - not char_defeated player
    type: event
    x: 6
    y: 10
  Route Music:
    actions:
    - play_music music_cathedral_theme
    conditions:
    - not music_playing music_cathedral_theme
    type: event
