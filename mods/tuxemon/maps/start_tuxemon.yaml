events:

  Scenario:
    actions:
    - change_bg gradient_blue
    - translated_dialog_choice spyder_campaign:xero_campaign:water_campaign,scenario_choice
    conditions:
    - not variable_set scenario_choice
    - not variable_set gender_choice
    - not variable_set race_choice
    type: event

  Appearance:
