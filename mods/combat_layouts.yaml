LAYOUT_GROUPS:
  1_PLAYER:
    - LEFT_COMBAT
  2_PLAYERS:
    - LEFT_COMBAT
    - RIGHT_COMBAT
  3_PLAYERS:
    - LEFT_COMBAT
    - CENTER_COMBAT
    - RIGHT_COMBAT

LAYOUT_COORDINATES:
  # PLAYER layout. Monster appears bottom-left; HUD panel slides in from the right.
  # "Left" refers to where the monster stands, not the HUD.
  LEFT_COMBAT:
    # Position where the monster appears on the left side of the battlefield
    home: [32, 62, 96, 70]
    # Position for the first monster in a 2 vs 2 setup (left side)
    home0: [30, 62, 96, 70] 
    # Position for the second monster in a 2 vs 2 setup (left side)
    home1: [-30, 62, 96, 70] 
    # Position of the HUD showing name, level, etc. (left side)
    hud: [145, 45, 110, 50] # fixed HUD for single monster
    # HUD position for the first monster in a 2 vs 2 setup.
    # It rests 2 nominal px from the right edge of the screen: the panel is
    # 102 px wide and the screen is 256, so x = 256 - 2 - 102.
    hud0: [152, 38, 110, 50]
    monster_status_icon: [160, 76, 9, 9]         # status icon for single battle
    monster_status_icon_slot_0: [166, 74, 9, 9] # status icon for first monster in 2 vs 2 setup
    # HUD position for the second monster in a 2 vs 2 setup,
    # keeping its -16 nominal px stagger from the first
    hud1: [136, 58, 110, 50]
    monster_status_icon_slot_1: [150, 94, 9, 9] # status icon for second monster in 2 vs 2 setup
    # Tuxeball icon strip (left side, shows number of available monsters)
    party: [145, 57, 110, 50] # placed just below the HUD region
    # Monster box image position for single monster
    # Centred on the island, which settles at home's centerx (32 + 96/2 = 80)
    monster_box_home: [80, 108, 2, 2]
    # Monster box image for first monster in a 2 vs 2 setup
    monster_box_home0: [110, 108, 2, 2]
    # Monster box image for second monster in a 2 vs 2 setup
    monster_box_home1: [50, 108, 2, 2]
    # These positions define where HUD text lines are drawn.
    # The values are in [x, y, width, height] format, but width/height are unused and set to 1.
    # Line 1 usually shows monster name, gender icon, and level.
    # Line 2 typically shows HP bar or additional status info.
    hud_line1: [12, 11, 1, 1]  # top line: monster, lv, etc.
    hud_line2: [12, 19, 1, 1]  # second line: position hp_bar

  # OPPONENT layout. Monster appears upper-right; HUD panel slides in from the left.
  # "Right" refers to where the monster stands, not the HUD.
  RIGHT_COMBAT:
    home: [140, 18, 96, 70]
    # Double battle: monster 1 position 
    home0: [110, 18, 96, 70]
    # Double battle: monster 2 position
    home1: [170, 18, 96, 70]
    hud: [18, 0, 85, 30]
    hud0: [18, -4, 85, 30]
    monster_status_icon: [13, 13, 9, 9]  # aligned with the hp bar, as the slots below
    monster_status_icon_slot_0: [14, 12, 9, 9]
    hud1: [34, 17, 85, 30]
    monster_status_icon_slot_1: [30, 33, 9, 9]
    party: [18, 12, 85, 30]
    monster_box_home: [188, 64, 2, 2]
    monster_box_home0: [158, 68, 2, 2]
    monster_box_home1: [218, 60, 2, 2]
    # Text blit offsets within the HUD sprite image
    hud_line1: [5, 5, 1, 1]
    hud_line2: [5, 13, 1, 1]

  # Used only in 3-player battles (not double battles).
  CENTER_COMBAT:
    home: [70, 40, 96, 70]
    home0: [100, 40, 96, 70]
    home1: [40, 40, 96, 70]
    hud: [80, 20, 110, 50]
    hud0: [80, 5, 110, 50]
    monster_status_icon: [93, 35, 9, 9]
    monster_status_icon_slot_0: [99, 41, 9, 9]
    hud1: [64, 35, 110, 50] # -16 nominal px left, matching home1 direction
    monster_status_icon_slot_1: [83, 71, 9, 9] # status icon aligned with hud1
    party: [80, 50, 110, 50]
    monster_box_home: [117, 86, 1, 1]
    monster_box_home0: [147, 86, 1, 1]
    monster_box_home1: [87, 86, 1, 1]
    hud_line1: [5, 11, 1, 1]
    hud_line2: [5, 19, 1, 1]
