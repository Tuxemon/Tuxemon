events:
  Environment:
    actions:
    - set_variable environment:interior
    conditions:
    - not variable_set environment:interior
    type: event
  Update Time Variables:
    actions:
    - update_time player
    conditions:
    - is current_state WorldState
    type: event
  Create Maple:
    actions:
    - create_npc maple_girl,1,1
    conditions:
    - not char_exists maple_girl
    type: event
  Start Maple:
    actions:
    - start_battle player,maple_girl
    conditions:
    - is char_exists maple_girl
    - is party_size player,greater_than,0
    - is party_size maple_girl,greater_than,0
    - not char_defeated player
    - not char_defeated maple_girl
    type: event
  Post Win:
    actions:
    - quit_world
    conditions:
    - is battle_outcome player,won,maple_girl
    - is current_state WorldState
    type: event
  Post Lose:
    actions:
    - quit_world
    conditions:
    - is battle_outcome player,lost,maple_girl
    - is current_state WorldState
    type: event
  Post Draw:
    actions:
    - quit_world
    conditions:
    - is battle_outcome player,draw,maple_girl
    - is current_state WorldState
    type: event
  Difficulty beginner:
    actions:
    - random_monster 10
    - random_monster 10,maple_girl
    - set_variable monsters:full
    conditions:
    - is variable_set difficulty:beginner
    - is char_exists maple_girl
    - not variable_set monsters:full
    type: event
  Difficulty easy:
    actions:
    - random_monster 15
    - random_monster 15
    - random_monster 15,maple_girl
    - random_monster 15,maple_girl
    - set_variable monsters:full
    conditions:
    - is variable_set difficulty:easy
    - is char_exists maple_girl
    - not variable_set monsters:full
    type: event
  Difficulty normal:
    actions:
    - random_monster 20
    - random_monster 20
    - random_monster 20
    - random_monster 20,maple_girl
    - random_monster 20,maple_girl
    - random_monster 20,maple_girl
    - set_variable monsters:full
    conditions:
    - is variable_set difficulty:normal
    - is char_exists maple_girl
    - not variable_set monsters:full
    type: event
  Difficulty hard:
    actions:
    - random_monster 25
    - random_monster 25
    - random_monster 25
    - random_monster 25
    - random_monster 25,maple_girl
    - random_monster 25,maple_girl
    - random_monster 25,maple_girl
    - random_monster 25,maple_girl
    - set_variable monsters:full
    conditions:
    - is variable_set difficulty:hard
    - is char_exists maple_girl
    - not variable_set monsters:full
    type: event
  Difficulty expert:
    actions:
    - random_monster 30
    - random_monster 30
    - random_monster 30
    - random_monster 30
    - random_monster 30
    - random_monster 30,maple_girl
    - random_monster 30,maple_girl
    - random_monster 30,maple_girl
    - random_monster 30,maple_girl
    - random_monster 30,maple_girl
    - set_variable monsters:full
    conditions:
    - is variable_set difficulty:expert
    - is char_exists maple_girl
    - not variable_set monsters:full
    type: event
